server.port=8080
spring.application.name=accounts
spring.profiles.active=prod
spring.config.import=optional:configserver:http://localhost:8071
 
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.path=/h2-console


logging.level.com.viv.accounts=DEBUG
logging.pattern.level.com.viv.accounts=%5p[${spring.application.name:},%X{X-B3-TraceId:-},%X{X-B3-SpanId:-}]


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.probes.enabled=true

management.endpoints.shutdown.enabled=true
management.info.env.enabled=true

management.metrics.tag.application=${spring.application.name}

endpoints.shutdown.enabled=true
# spring.rabbitmq.host=${RABBITMQ_HOST}
# spring.rabbitmq.port=${RABBITMQ_PORT}
# spring.rabbitmq.username=${RABBITMQ_USERNAME}
# spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# http://localhost:8071/accounts/prod


spring.cloud.openfeign.circuitbreaker.enabled=true

spring.cloud.function.definition=updateCommuncation
spring.cloud.stream.bindings.updateCommuncation-in-0.destination=communication-send
spring.cloud.stream.bindings.updateCommuncation-in-0.group=${spring.application.name}

spring.cloud.stream.bindings.sendCommunication-out-0.destination=send-communication
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8070/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10

info.app.version=1.0.0
info.app.name=${spring.application.name}
info.app.description=Account Service for Learning Purposes
info.app.company=In28Minutes

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# resilience4j.circuitbreaker.configs.default.ignoreExceptions=org.springframework.web.client.HttpServerErrorException, java.io.NullPointerException
# resilience4j.circuitbreaker.configs.default.retryExceptions=java.io.IOException


resilience4j.ratelimiter.configs.default.limitRefreshPeriod=5000
resilience4j.ratelimiter.configs.default.timeoutDuration=1000
resilience4j.ratelimiter.configs.default.limitForPeriod=1

